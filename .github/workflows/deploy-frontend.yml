name: Deploy Frontend to VPS

on:
  push:
    branches: [main]
    paths:
      - "WebAPp/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: WebAPp/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: pnpm
          cache-dependency-path: WebAPp/pnpm-lock.yaml

      - name: Install dependencies in WebAPp
        run: pnpm install --frozen-lockfile
        working-directory: WebAPp

      - name: Build WebAPp
        run: pnpm build
        working-directory: WebAPp

      - name: Stop front-end and clear old build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            systemctl stop front-end
            rm -rf /var/www/front-end/*

      - name: Deploy to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "WebAPp/.output/*"
          target: "/var/www/front-end/"
          strip_components: 2 # Removes WebAPp/.output/ from path

      - name: Restart front-end service
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            systemctl start front-end
            systemctl status front-end